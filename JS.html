<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Example</title>
</head>

<body>

    <h1 id="message">Hello!</h1>

    <button onclick="changeMessage()">Click Me</button>

    <script>
        function changeMessage() {
            document.getElementById("message").innerHTML =
                "Welcome to JavaScript!";
        }
    </script>

</body>
</html>
