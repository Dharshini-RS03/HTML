<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1 id="message"></h1>

        <p>Welcome to our website!</p>

    </div>

    <script>

        let params = new URLSearchParams(window.location.search);

        let name = params.get("name");

        document.getElementById("message").innerHTML =
            "Hello, " + name + "!";

    </script>

</body>
</html>
